/* ===== 홀로그램 상태창 테마 ===== */
:root{
  --bg:#050b24; --panel:rgba(10,28,78,.58); --panel2:rgba(20,50,120,.45);
  --cy:#6fe3ff; --cy2:#3a8bff; --line:rgba(111,227,255,.55);
  --tx:#e8f4ff; --dim:#8fb3d9; --y:#ffd166; --g:#5ef2a0; --r:#ff6b81;
  --sys:'Galmuri11','NeoDunggeunmo','Pretendard','Noto Sans KR',monospace;
  --font:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;min-height:100%;color:var(--tx);font-family:var(--font);font-size:18px;line-height:1.6}
body{background:transparent}
body::before{content:"";position:fixed;inset:-20px;z-index:-2;background:var(--bgimg) center/cover no-repeat;filter:blur(8px) brightness(.32) saturate(1.1)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 0%,rgba(58,139,255,.18),transparent 60%)}
body.on-title::before{filter:none;inset:0;opacity:0}
#app{max-width:1280px;margin:0 auto;padding:22px 22px 80px}
body.on-title #app{max-width:none;padding:0}
img.spr{image-rendering:pixelated;vertical-align:middle}
b{color:var(--y);font-weight:600}
.up{color:var(--g)!important}.down{color:var(--r)!important}.flat{color:var(--dim)}
small{color:var(--dim)}
h1,h2,h3,.hd,.hd2,.win-title,.btn,.tab,.timer,.yearbig,.code span,.bigmoney,.tbl th,.hud,.shud,.nmonth,.qn{font-family:var(--sys)}

/* 패널 */
.win,.pcard,.news,.q,.calc,.box{position:relative;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 0 16px rgba(58,139,255,.28),inset 0 0 24px rgba(58,139,255,.12);backdrop-filter:blur(4px)}
.win{margin:20px 0}
.win::before,.win::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--cy);pointer-events:none}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.win-title{color:var(--cy);padding:10px 18px 8px;font-size:16px;letter-spacing:.5px;border-bottom:1px solid rgba(111,227,255,.25)}
.win-title::before{content:"▍";color:var(--cy2)}
.win-body{padding:16px 20px}
.warnwin{--line:rgba(255,209,102,.7)}
.warnwin .win-title{color:var(--y)}
.warnwin::before,.warnwin::after{border-color:var(--y)}
.narrow{max-width:640px;margin:30px auto}
.center{text-align:center}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:20px 0}
.row.center{justify-content:center}
.note{color:var(--dim);font-size:14px;margin-top:10px}

/* 버튼 */
.btn{font-size:17px;color:var(--tx);background:rgba(10,30,80,.6);border:1px solid var(--line);padding:9px 20px;margin:3px;cursor:pointer;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:.15s}
.btn:hover{background:rgba(58,139,255,.35);color:#fff;border-color:var(--cy)}
.btn:active{transform:translateY(1px)}
.btn.big{font-size:20px;padding:12px 30px;background:linear-gradient(180deg,rgba(111,227,255,.35),rgba(58,139,255,.35));border-color:var(--cy);color:#fff}
.btn.big:hover{background:linear-gradient(180deg,rgba(111,227,255,.55),rgba(58,139,255,.55))}
.btn.alt{background:rgba(58,139,255,.25)}
.btn.small{font-size:14px;padding:6px 14px}
.btn.tiny{font-size:13px;padding:3px 10px;margin:1px}
.btn.ghost{background:transparent;border-color:rgba(111,227,255,.3);color:var(--dim)}
.btn.sel{background:var(--cy);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:not-allowed}
#audiobar{position:fixed;right:14px;bottom:12px;z-index:60;display:flex;gap:4px}
#audiobar .btn{background:rgba(5,11,36,.8)}

/* ===== 타이틀: 배경 이미지 + 프레임 안 텍스트 ===== */
.stage-wrap{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;
  background:var(--bgimg) center/100% 100% no-repeat;container-type:inline-size}

.frame{position:absolute;left:17.5%;top:22%;width:65%;height:51%;padding:2.2cqw 3cqw;display:flex;flex-direction:column;justify-content:center;
  font-family:var(--sys);text-shadow:0 0 .6cqw rgba(111,227,255,.6);animation:holo .7s ease-out}
@keyframes holo{from{opacity:0;transform:scaleY(.6);filter:brightness(2)}to{opacity:1;transform:none;filter:none}}
.sys-head{display:flex;justify-content:space-between;align-items:center;font-size:1.25cqw;color:var(--cy);border-bottom:1px solid rgba(111,227,255,.45);padding-bottom:.5cqw;margin-bottom:1.2cqw}
.sys-alert{color:var(--y);animation:blink 1.4s steps(2) infinite}
.sys-text{font-size:2.05cqw;line-height:1.45;color:#fff;min-height:6cqw}
.caret{color:var(--cy);animation:blink .8s steps(2) infinite}
.sys-title{font-size:3cqw;color:#fff;line-height:1.3}
.sys-sub{font-size:1.2cqw;color:var(--dim);margin-top:.4cqw}
.sys-stat{margin-top:.8cqw}
.stat-row{display:flex;justify-content:space-between;font-size:1.15cqw;padding:.3cqw 0;border-bottom:1px dashed rgba(111,227,255,.25);animation:fadein .4s both}
.stat-row:nth-child(2){animation-delay:.12s}.stat-row:nth-child(3){animation-delay:.24s}.stat-row:nth-child(4){animation-delay:.36s}
.stat-row span{color:var(--dim)}
.rank{color:var(--r)!important}
.sys-btns{display:flex;gap:1.5cqw;justify-content:center;flex-wrap:wrap;margin-top:1.6cqw}
.sys-btns.col{flex-direction:column;align-items:center;gap:.8cqw}
.sys-btns.col .sys-y{width:60%}
.sys-y{font-size:1.45cqw;padding:.8cqw 2cqw;background:rgba(111,227,255,.18);border-color:var(--cy);color:#fff}
.sys-y:hover{background:rgba(111,227,255,.4)}
.sys-y.alt{background:rgba(58,139,255,.22)}
.sys-n{font-size:1.15cqw;padding:.8cqw 1.6cqw;background:rgba(255,107,129,.1);border-color:rgba(255,107,129,.6);color:#ffc2cc}
.sys-btns .btn.small{font-size:1cqw}
.stage-foot{position:absolute;left:0;right:0;bottom:16px;z-index:2;text-align:center;font-size:14px;text-shadow:0 1px 3px #000;color:rgba(232,244,255,.75);margin:0}
.stage-foot a{color:var(--cy)}
.glitch{animation:glitch .3s steps(3) 2}
@keyframes glitch{33%{transform:translate(-.4cqw,.1cqw);filter:hue-rotate(150deg)}66%{transform:translate(.4cqw,-.1cqw)}}
.loadbar{height:1.4cqw;border:1px solid var(--cy);margin:1.4cqw 0 .6cqw;padding:2px}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy2),var(--cy));box-shadow:0 0 10px var(--cy)}
@keyframes blink{50%{opacity:0}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 공통 제목 */
.hd{text-align:center;color:#fff;font-size:30px;margin:24px 0 8px;font-weight:normal;text-shadow:0 0 12px rgba(111,227,255,.7)}
.hd2{text-align:center;color:var(--cy);margin:26px 0 4px;font-weight:normal}
.blink{color:var(--y);animation:blink 1s steps(2) infinite}

/* HUD */
.hud,.shud{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 16px;background:rgba(5,11,36,.6);border:1px solid var(--line);font-size:15px}
.hud-l{color:var(--cy)}
.years{display:flex;gap:4px}
.yd{padding:0 7px;color:var(--dim);font-size:14px;border:1px solid transparent}
.yd.done{color:var(--cy)}.yd.now{border-color:var(--cy);color:#fff;background:rgba(111,227,255,.2)}

/* 규칙/상품 */
.rules{max-width:980px;margin:0 auto;font-size:18px}
.rules li{margin:6px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:18px 0}
.pcard{padding:14px 12px;text-align:center;border-top:3px solid var(--c)}
.pname{color:var(--c);font-family:var(--sys);font-size:18px;margin-top:6px}
.ptag{font-size:12px;color:var(--dim);min-height:20px}
.pdesc{font-size:13px;text-align:left;margin-top:8px;color:#c9dcf0;line-height:1.5}
.meters{margin-top:8px}
.meter{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim)}
.meter i{display:flex;gap:2px}
.meter b{display:inline-block;width:11px;height:6px;background:rgba(143,179,217,.25)}
.meter b.on{background:var(--c);box-shadow:0 0 4px var(--c)}

/* 연도/뉴스 */
.yearbig{text-align:center;margin:18px 0 4px}
.yearbig span{display:block;font-size:96px;line-height:1;color:#fff;text-shadow:0 0 18px var(--cy),0 0 40px var(--cy2);animation:fadein .6s}
.yearbig small{font-size:22px;color:var(--cy)}
.newsbox{max-width:1060px;margin:18px auto}
.newsbox>.win-title{border:0;padding-left:0}
.news{display:flex;gap:16px;align-items:flex-start;margin:10px 0;padding:12px 18px;opacity:0;animation:fadein .5s forwards;border-left:3px solid var(--cy)}
.nmonth{color:var(--cy);font-size:13px}
.nhead{font-size:21px;font-weight:700;line-height:1.35}
.nbody{font-size:16px;color:#c9dcf0;margin-top:3px}
.status{text-align:center;color:var(--dim)}
.status span{margin:0 10px}
.life{color:var(--y)}

/* 생활 이벤트 */
.lhead{color:var(--y);font-size:28px;margin:10px 0;font-family:var(--sys);font-weight:normal}
.lbody{font-size:20px}
.lrule{background:rgba(5,11,36,.5);border:1px solid rgba(255,209,102,.35);padding:10px 14px;margin:12px auto;max-width:760px;font-size:16px}
.lq{color:var(--cy);font-size:18px}

/* 타이머 */
.timer{font-size:130px;text-align:center;color:#fff;line-height:1.1;text-shadow:0 0 20px var(--cy)}
.timer.hurry{color:var(--r);text-shadow:0 0 20px var(--r)}
.timerbar{height:10px;max-width:880px;margin:0 auto;border:1px solid var(--line);padding:1px}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy2),var(--cy));box-shadow:0 0 8px var(--cy);transition:width 1s linear}
.checklist{max-width:820px;margin:24px auto;font-size:19px}
.checklist div{margin:6px 0}
.hint{max-width:900px;margin:0 auto;text-align:center;color:var(--cy);font-size:18px}

/* 결과 */
.resgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
.resgrid.stack{grid-template-columns:1fr}
@media (max-width:1000px){.resgrid{grid-template-columns:1fr}}
.bars{display:flex;justify-content:space-around;align-items:stretch;height:320px;gap:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bval{font-size:15px;height:24px;font-family:var(--sys)}
.barea{flex:1;width:52%;position:relative}
.bzero{position:absolute;left:-40%;right:-40%;top:50%;height:1px;background:var(--dim)}

  rulesHTML:

    '<li>모두 <b>1,000만 원</b>으로 시작합니다. 한 라운드 = 1년, <b>2018년부터 2025년까지 8라운드</b>.</li>' +

    '<li>수익률은 <b>실제 한국 시장 데이터</b>로 계산합니다. 기업 이름만 이니셜로 바꿨어요.</li>' +
    '<li>결과가 공개되면 화면의 <b>4자리 코드</b>를 학생 계산기에 입력해 1년을 진행합니다.</li>' +
    '<li>매년 학생 계산기의 메모 칸에 <b>투자 근거 한 줄</b>을 남깁니다.</li>' +

    '<h3 style="color:#38a8f8">교사 화면 (프로젝터)</h3><ul>' +
    '<li>[교사 진행 화면] → 규칙 → 매년 <b>뉴스 → (생활 이벤트) → 투자 결정 타이머 → 결과 공개</b> 순서.</li>' +
    '<li>키보드: <b>→</b> 다음, <b>←</b> 이전, <b>F</b> 전체 화면. 오른쪽 아래 버튼으로 BGM·효과음 켜기/끄기.</li>' +
    '<li>결과 화면의 <b>4자리 코드</b>를 학생에게 공개하면 학생 계산기가 그해 결과를 계산합니다.</li>' +

    '<li>같은 HTML 파일을 열고 [학생 투자 계산기] 선택 → 이름 입력.</li>' +
    '<li>비율 입력 → 코드 입력 → [확정]. 기록은 그 기기의 브라우저에 저장됩니다(새로고침해도 유지).</li>' +

<script>

  const won = (v) => {
    const man = Math.round(v / 10000);
    if (Math.abs(man) >= 10000) {
      const eok = Math.floor(man / 10000), rest = man % 10000;
      return eok + '억' + (rest ? ' ' + rest.toLocaleString('ko-KR') + '만' : '') + '원';
    }
    return man.toLocaleString('ko-KR') + '만원';
  };
  const pct = (v, d) => (v > 0 ? '+' : '') + v.toFixed(d == null ? 1 : d) + '%';
  const cls = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : 'flat');
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  /* ---------- 8비트 사운드 (효과음 + BGM, 외부 파일 없이 WebAudio로 합성) ---------- */
  let actx = null, master = null, bgmGain = null, sfxGain = null;
  let muted = !!store.get('dfg_sfx_off'), bgmOn = store.get('dfg_bgm_on') !== false;
  function ac() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);
        bgmGain = actx.createGain(); bgmGain.gain.value = 0.5; bgmGain.connect(master);
        sfxGain = actx.createGain(); sfxGain.gain.value = 1; sfxGain.connect(master);
      } catch (e) { return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, t, dur, type, vol, dest, slideTo) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(t, dur, vol, dest, hp) {
    const c = ac(); if (!c) return;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp || 4000;
    s.buffer = buf; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || sfxGain); s.start(t);
  }
  const NOTE = {};
  ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'].forEach((n, k) => {
    for (let o = 1; o <= 7; o++) NOTE[n + o] = 440 * Math.pow(2, (k - 9) / 12 + (o - 4));
  });
  function seq(notes, step, type, vol) { // notes: "C5 E5 G5"
    const c = ac(); if (!c || muted) return;
    const t0 = c.currentTime + 0.01;
    notes.split(' ').forEach((n, i) => { if (n !== '-' && NOTE[n]) tone(NOTE[n], t0 + i * step, step * 1.1, type || 'square', vol || 0.07); });
  }
  const sfx = {
    click() { seq('A5', 0.04, 'square', 0.05); },
    coin() { seq('B5 E6', 0.07, 'square', 0.07); },
    select() { seq('E5 A5', 0.04, 'square', 0.05); },
    up() { seq('C5 E5 G5 C6 - G5 C6', 0.08, 'square', 0.07); },
    down() { const c = ac(); if (!c || muted) return; tone(NOTE.G4, c.currentTime, 0.7, 'triangle', 0.12, sfxGain, NOTE.C3); seq('- - - - E4 D#4 D4', 0.09, 'square', 0.05); },
    tick() { const c = ac(); if (!c || muted) return; noise(c.currentTime, 0.03, 0.08, sfxGain, 6000); },
    alarm() { seq('A5 - A5 - A5', 0.09, 'square', 0.07); },
    news() { const c = ac(); if (!c || muted) return; seq('G5 G5 - D6', 0.07, 'square', 0.06); noise(c.currentTime, 0.05, 0.05); },
    warn() { seq('E5 C5 E5 C5', 0.11, 'sawtooth', 0.05); },
    fanfare() { seq('G4 C5 E5 G5 - E5 G5 - - C6', 0.1, 'square', 0.07); seq('C3 - - - C3 - - - G3 C4', 0.1, 'triangle', 0.12); },
    crash() { const c = ac(); if (!c || muted) return; noise(c.currentTime, 0.5, 0.12, sfxGain, 300); tone(NOTE.C4, c.currentTime, 0.6, 'square', 0.06, sfxGain, NOTE.C2); },
    error() { seq('D3 - D3', 0.07, 'square', 0.07); },
    type() { const c = ac(); if (!c || muted) return; tone(1800 + Math.random() * 400, c.currentTime, 0.02, 'square', 0.02); },
  };

  /* ----- BGM: 장면별 루프 트랙 (멜로디 / 베이스 / 드럼) ----- */
  const TRACKS = {
    title: { bpm: 132,
      lead: 'E5 - G5 - C6 - B5 G5 | A5 - F5 - A5 - C6 - | G5 - E5 - G5 - B5 A5 | G5 - - - - - - - | E5 - G5 - C6 - D6 E6 | D6 - C6 - A5 - F5 - | G5 - A5 - B5 - D6 - | C6 - - - - - - -',

  /* ---------- 도트 차트 (canvas) ---------- */
  function drawLineChart(canvas, series, labels, opts) {
    opts = opts || {};
    const W = canvas.width, H = canvas.height, x = canvas.getContext('2d');
    x.imageSmoothingEnabled = false;
    const LT = !!opts.light;
    x.clearRect(0, 0, W, H); x.fillStyle = LT ? '#ffffff' : 'rgba(5,11,36,0.55)'; x.fillRect(0, 0, W, H);
    const fs = opts.font || 18; const pad = { l: fs * 6, r: fs * 8.5, t: fs * 1.4, b: fs * 2.4 };
    let mn = Infinity, mx = -Infinity;
    series.forEach((s) => s.path.forEach((v) => { mn = Math.min(mn, v); mx = Math.max(mx, v); }));
    mn = Math.min(mn, START * 0.9); mx = Math.max(mx, START * 1.1);
    const LOG = !!opts.log, f = (v) => (LOG ? Math.log(v) : v);
    const sx = (i) => pad.l + (W - pad.l - pad.r) * i / (labels.length - 1);
    const sy = (v) => pad.t + (H - pad.t - pad.b) * (1 - (f(v) - f(mn)) / (f(mx) - f(mn)));
    x.font = (opts.font || 18) + 'px ' + getComputedStyle(document.body).fontFamily;
    // 격자
    const steps = 5;
    for (let k = 0; k <= steps; k++) {
      const v = LOG ? Math.exp(f(mn) + (f(mx) - f(mn)) * k / steps) : mn + (mx - mn) * k / steps, yy = Math.round(sy(v));
      x.fillStyle = LT ? '#dddddd' : 'rgba(111,227,255,0.15)';
      for (let xx = pad.l; xx < W - pad.r; xx += 8) x.fillRect(xx, yy, 4, 2);
      x.fillStyle = LT ? '#555555' : '#8fb3d9'; x.textAlign = 'right'; x.fillText(won(v), pad.l - 8, yy + fs * 0.35);
    }
    // 원금선
    x.fillStyle = LT ? '#bbbbbb' : '#ffd166';
    const y0 = Math.round(sy(START));
    for (let xx = pad.l; xx < W - pad.r; xx += 12) x.fillRect(xx, y0, 8, 2);
    x.textAlign = 'center'; x.fillStyle = LT ? '#555555' : '#8fb3d9';
    labels.forEach((l, i) => x.fillText(l, sx(i), H - fs * 0.8));
    // 선 (계단식 도트)
    const ends = [];
    series.forEach((s) => {
      x.fillStyle = (LT && s.lightColor) || s.color;
      const th = Math.round((s.bold ? 5 : 3) * fs / 18);
      for (let i = 0; i < s.path.length - 1; i++) {
        const x1 = sx(i), y1 = sy(s.path[i]), x2 = sx(i + 1), y2 = sy(s.path[i + 1]);
        const n = Math.ceil(Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) / 3);
        for (let k = 0; k <= n; k++) {
          const px = Math.round((x1 + (x2 - x1) * k / n) / 2) * 2, py = Math.round((y1 + (y2 - y1) * k / n) / 2) * 2;
          x.fillRect(px - th / 2, py - th / 2, th, th);
        }
      }
      s.path.forEach((v, i) => { const d = Math.round(8 * fs / 18); x.fillRect(sx(i) - d / 2, sy(v) - d / 2, d, d); });
      ends.push({ y: sy(s.path[s.path.length - 1]), s });
    });
    // 끝 라벨 (겹침 회피)
    ends.sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < fs * 1.25) ends[i].y = ends[i - 1].y + fs * 1.25;
    x.textAlign = 'left';
    ends.forEach((e) => {
      x.fillStyle = (LT && e.s.lightColor) || e.s.color;
      x.fillText(e.s.name, W - pad.r + 12, e.y + fs * 0.35);
    });
  }

  function connect() {
    app().innerHTML =
      '<div class="stage-wrap"><div class="stage"><div class="frame"><div class="sys-head"><span class="sys-tag">[System]</span><span class="sys-alert">접속 중…</span></div>' +
      '<div class="sys-text">시뮬레이션에 접속하고 있습니다.</div>' +
      '<div class="loadbar"><i id="lb"></i></div><div class="sys-sub" id="ld">데이터를 불러오는 중…</div></div></div></div>';
    let p = 0;
    const steps = ['2018~2025 시장 데이터 동기화…', '기준금리·물가 데이터 로드…', '종목 7개 시세 로드…', '접속 완료!'];
    const t = setInterval(() => {
      p += 4; $('#lb').style.width = p + '%';
      $('#ld').textContent = steps[Math.min(3, Math.floor(p / 26))];

  function modeSelect() {
    document.body.classList.add('on-title');
    app().innerHTML =
      '<div class="stage-wrap"><div class="stage"><div class="frame">' +
      '<div class="sys-head"><span class="sys-tag">[System]</span><span class="sys-alert">접속 완료</span></div>' +

      '<button class="btn sys-y alt" data-go="student">[플레이어] 학생 투자 계산기</button>' +
      '<button class="btn ghost small" data-go="guide">사용법·자료 출처</button>' +

      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>연도</th>' + P.map((p) => '<th>' + p.short + '</th>').join('') + '<th>물가</th><th>기준금리<br>(연말)</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="note">' + D.dataNoteHTML + '</div>' +
      '</div></div>' +

      '</div>';
    $('#back').onclick = () => { sfx.click(); title(); };

  /* ========== 교사 진행 ========== */
  let T = { i: 0, phase: 'intro' };
  let timerId = null, timerLeft = 0;
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  function teacherIntro() {
    T = { i: 0, phase: 'intro' }; setMode('teacher'); playBgm('title');
    app().innerHTML =
      '<div class="screen t-intro">' +
      '<h2 class="hd">[System] 시뮬레이션 규칙</h2>' +
      '<div class="rules">' + D.rulesHTML + '</div>' +
      '<h3 class="hd2">[인벤토리] 투자 상품 ' + P.length + '종</h3>' +
      '<div class="cards">' + P.map((p) =>
        '<div class="pcard" style="--c:' + p.color + '">' + img(p.icon, 4) +
        '<div class="pname">' + p.name + '</div>' +
        '<div class="ptag">' + p.tag + '</div>' +
        '<div class="meters">' +
        meter('안전성', p.safety) + meter('수익성', p.profit) + meter('유동성', p.liquid) +
        '</div><div class="pdesc">' + p.desc + '</div></div>').join('') +
      '</div>' +
      '<div class="row center"><button class="btn" id="back">◀ 처음</button><button class="btn big" id="go">' + Y[0].year + '년 시작 ▶</button></div>' +
      '</div>';
    $('#back').onclick = () => { sfx.click(); title(); };
    $('#go').onclick = () => { sfx.coin(); teacherYear(0); };
  }
  function meter(label, n) {
    let s = '<div class="meter"><span>' + label + '</span><i>';
    for (let k = 1; k <= 5; k++) s += '<b class="' + (k <= n ? 'on' : '') + '"></b>';
    return s + '</i></div>';
  }

  function hud(i) {
    let dots = '';
    Y.forEach((y, k) => { dots += '<span class="yd ' + (k < i ? 'done' : k === i ? 'now' : '') + '">' + String(y.year).slice(2) + '</span>'; });
    return '<div class="hud"><span class="hud-l">ROUND ' + (i + 1) + '/' + Y.length + '</span><span class="years">' + dots + '</span>' +
      '<span class="hud-r"><button class="btn tiny ghost" id="home">■ 처음</button></span></div>';
  }
  function bindHud() {
    const h = $('#home'); if (h) h.onclick = () => { if (confirmHome()) title(); };
  }
  function confirmHome() { return true; }

  // 1단계: 뉴스
  function teacherYear(i) {
    stopTimer();
    T = { i, phase: 'news' }; playBgm('news'); sfx.news();
    const y = Y[i];
    const news = y.news.map((n, k) =>
      '<div class="news" style="animation-delay:' + (0.25 + k * 0.5) + 's">' + img(n.icon, 3) +
      '<div><div class="nmonth">' + n.when + '</div><div class="nhead">' + n.head + '</div><div class="nbody">' + n.body + '</div></div></div>').join('');
    app().innerHTML =
      '<div class="screen t-year">' + hud(i) +
      '<div class="yearbig"><span>' + y.year + '</span><small>' + y.tagline + '</small></div>' +
      '<div class="newsbox"><div class="win-title">📰 ' + y.year + '년 경제 뉴스</div>' + news + '</div>' +
      '<div class="status">' +
      '<span>기준금리 ' + y.rateStart + '</span>' +
      (y.lifeEvent ? '<span class="life">⚠ 생활 이벤트 있음</span>' : '') +
      '</div>' +
      '<div class="row center">' +
      (i > 0 ? '<button class="btn" id="prev">◀ 이전</button>' : '') +
      '<button class="btn big" id="next">투자 결정 시간 ▶</button></div>' +
      '</div>';
    bindHud();
    if (i > 0) $('#prev').onclick = () => { sfx.click(); teacherResult(i - 1); };
    $('#next').onclick = () => { sfx.coin(); if (y.lifeEvent) teacherLife(i); else teacherDecide(i); };
  }

  // 생활 이벤트
  function teacherLife(i) {
    const y = Y[i], e = y.lifeEvent;
    app().innerHTML =
      '<div class="screen t-life">' + hud(i) +
      '<div class="win warnwin"><div class="win-title">[돌발 퀘스트] 생활 이벤트 발생!</div><div class="win-body center">' +
      img('warn', 5) +
      '<h2 class="lhead">' + e.head + '</h2>' +
      '<p class="lbody">' + e.body + '</p>' +
      '<div class="lrule">' + e.rule + '</div>' +
      '<p class="lq">💬 ' + e.question + '</p>' +
      '</div></div>' +
      '<div class="row center"><button class="btn big" id="next">투자 결정 시간 ▶</button></div></div>';
    bindHud();
    sfx.warn();
    $('#next').onclick = () => { sfx.coin(); teacherDecide(i); };
  }

  // 2단계: 결정 타이머
  function teacherDecide(i) {
    stopTimer();
    T = { i, phase: 'decide' }; playBgm('decide');
    const y = Y[i];
    const DS = (D.decideSecondsByRound && D.decideSecondsByRound[i]) || D.decideSeconds;
    timerLeft = DS;
    app().innerHTML =
      '<div class="screen t-decide">' + hud(i) +
      '<h2 class="hd">[퀘스트] ' + y.year + '년 자산 배분을 완료하세요!</h2>' +
      '<div class="timer" id="timer"></div>' +
      '<div class="timerbar"><i id="tbar"></i></div>' +
      '<div class="checklist">' +
      '<div>① 학생 계산기에 <b>비율(%)</b> 입력 → 합계 100% 확인</div>' +
      '<div>② 계산기의 메모 칸에 <b>투자 근거 한 줄</b> 쓰기</div>' +
      '<div>③ 계산기의 <b>[확정]</b> 버튼 누르기</div>' +
      '</div>' +
      '<div class="hint">💡 생각해 볼 점: ' + y.hint + '</div>' +
      '<div class="row center">' +
      '<button class="btn" id="back">◀ 뉴스 다시</button>' +
      '<button class="btn" id="pause">⏸ 일시정지</button>' +
      '<button class="btn" id="add">+30초</button>' +
      '<button class="btn big" id="next">결과 공개 ▶</button></div></div>';
    bindHud();
    let paused = false;
    const render = () => {
      const m = Math.floor(timerLeft / 60), s = timerLeft % 60;
      const el = $('#timer'); if (!el) return stopTimer();
      el.textContent = m + ':' + String(s).padStart(2, '0');
      el.className = 'timer' + (timerLeft <= 10 ? ' hurry' : '');
      $('#tbar').style.width = Math.min(100, Math.max(0, timerLeft / DS * 100)) + '%';
    };
    render();
    timerId = setInterval(() => {
      if (paused) return;
      timerLeft = Math.max(0, timerLeft - 1);
      if (timerLeft <= 10 && timerLeft > 0) sfx.tick();
      if (timerLeft === 0) { sfx.alarm(); stopTimer(); }
      render();
    }, 1000);
    $('#pause').onclick = (ev) => { paused = !paused; ev.target.textContent = paused ? '▶ 계속' : '⏸ 일시정지'; };
    $('#add').onclick = () => { timerLeft += 30; render(); if (!timerId) teacherDecideResume(); };
    $('#back').onclick = () => { stopTimer(); teacherYear(i); };
    $('#next').onclick = () => { stopTimer(); teacherResult(i, true); };
    function teacherDecideResume() {
      timerId = setInterval(() => {
        if (paused) return;
        timerLeft = Math.max(0, timerLeft - 1);
        if (timerLeft === 0) { sfx.alarm(); stopTimer(); }
        render();
      }, 1000);
    }
  }

  // 3단계: 결과 공개
  function teacherResult(i, animate) {
    stopTimer();
    T = { i, phase: 'result' }; playBgm('calm');
    const y = Y[i];
    const max = Math.sqrt(Math.max(...P.map((p) => Math.abs(y.returns[p.id])), 10));
    const bars = P.map((p, k) => {
      const r = y.returns[p.id];
      const h = Math.sqrt(Math.abs(r)) / max * 100;
      return '<div class="bcol">' +
        '<div class="bval ' + cls(r) + '">' + pct(r) + '</div>' +
        '<div class="barea"><div class="bzero"></div>' +
        '<div class="bar ' + (r >= 0 ? 'pos' : 'neg') + '" style="--h:' + h + '%;--c:' + p.color + ';animation-delay:' + (animate ? k * 0.35 : 0) + 's"></div></div>' +
        '<div class="blab">' + img(p.icon, 3) + '<span>' + p.short + '</span></div></div>';
    }).join('');
    const why = P.map((p) => '<li><b style="color:' + p.color + '">' + p.short + '</b> ' + y.why[p.id] + '</li>').join('');
    const best = P.reduce((a, b) => (y.returns[a.id] >= y.returns[b.id] ? a : b));
    app().innerHTML =
      '<div class="screen t-result">' + hud(i) +
      '<h2 class="hd">[결과] ' + y.year + '년 정산이 완료되었습니다</h2>' +
      '<div class="resgrid">' +
      '<div class="win"><div class="win-title">상품별 1년 수익률</div><div class="win-body"><div class="bars">' + bars + '</div>' +
      '<div class="cpi">이 해 물가상승률 <b>' + y.cpi.toFixed(1) + '%</b> · 연말 기준금리 <b>' + y.baseRate.toFixed(2) + '%</b>' + (y.kospi != null ? ' · KOSPI <b class="' + cls(y.kospi) + '">' + pct(y.kospi) + '</b>' : '') + '</div></div></div>' +
      '<div class="win"><div class="win-title">왜 이렇게 됐을까?</div><div class="win-body"><ul class="why">' + why + '</ul>' +
      '<div class="code">학생 계산기 결과 코드 <span>' + y.code + '</span></div></div></div>' +
      '</div>' +
      '<div class="row center">' +
      '<button class="btn" id="prev">◀ 뉴스</button>' +
      (i < Y.length - 1 ? '<button class="btn big" id="next">' + Y[i + 1].year + '년으로 ▶</button>' : '<button class="btn big" id="next">최종 결산 ▶</button>') +
      '</div></div>';
    bindHud();
    if (animate) { const worst = Math.min(...P.map((p) => y.returns[p.id])); if (worst <= -30) sfx.crash(); setTimeout(() => (y.returns[best.id] > 0 ? sfx.up : sfx.down)(), worst <= -30 ? 600 : 0); }
    $('#prev').onclick = () => { sfx.click(); teacherYear(i); };
    $('#next').onclick = () => { sfx.coin(); if (i < Y.length - 1) teacherYear(i + 1); else teacherFinal(); };
  }

  // 최종 결산
  function teacherFinal() {
    stopTimer();
    const bm = benchmarks();
    const labels = ['시작'].concat(Y.map((y) => String(y.year)));
    const infl = cumInflation(Y.length);
    const rows = bm.map((b) => {
      const end = b.path[b.path.length - 1];
      const r = (end / START - 1) * 100, real = (end / infl / START - 1) * 100;
      return { b, end, r, real, mdd: maxDrawdown(b.path) };
    }).sort((a, b) => b.end - a.end);
    app().innerHTML =
      '<div class="screen t-final">' +
      '<h2 class="hd">' + img('coin', 3) + ' 최종 결산 — ' + Y[0].year + '~' + Y[Y.length - 1].year + ' ' + img('coin', 3) + '</h2>' +
      '<div class="resgrid final">' +
      '<div class="win"><div class="win-title">만약 한 가지 전략만 썼다면? (' + won(START) + ' 시작)</div><div class="win-body">' +
      '<canvas id="chart" width="1000" height="640"></canvas><div class="note">세로축은 로그 눈금(같은 간격 = 같은 배율)입니다. 한 상품이 너무 크게 올라 다른 선이 묻히지 않도록 했어요.</div></div></div>' +
      '<div class="win"><div class="win-title">전략별 성적표</div><div class="win-body"><table class="tbl"><thead><tr><th>전략</th><th>최종 자산</th><th>수익률</th><th>실질<br>수익률</th><th>최대<br>낙폭</th></tr></thead><tbody>' +
      rows.map((x) => '<tr' + (x.b.bold ? ' class="hl"' : '') + '><td style="color:' + x.b.color + '">' + x.b.name + '</td><td>' + won(x.end) + '</td><td class="' + cls(x.r) + '">' + pct(x.r) + '</td><td class="' + cls(x.real) + '">' + pct(x.real) + '</td><td class="down">' + x.mdd.toFixed(1) + '%</td></tr>').join('') +
      '</tbody></table><div class="note">실질 수익률 = 8년 누적 물가(' + pct((infl - 1) * 100) + ')를 뺀 구매력 기준. 최대 낙폭 = 연말 기준 최고점 대비 가장 크게 떨어진 비율. 균등분산은 매년 초 ' + P.length + '종에 같은 비율로 다시 나눈 경우.</div></div></div>' +
      '</div>' +
      '<div class="row center"><button class="btn" id="prev">◀ 마지막 해</button><button class="btn" id="rank">🏆 우리 반 순위 입력</button><button class="btn big" id="next">성찰 질문 ▶</button></div></div>';
    drawLineChart($('#chart'), bm, labels, { log: true, font: 24 });
    playBgm('final'); sfx.fanfare();
    $('#prev').onclick = () => teacherResult(Y.length - 1);
    $('#rank').onclick = () => { sfx.click(); ranking(); };
    $('#next').onclick = () => { sfx.coin(); reflect(); };
  }

  // 순위 입력 (선택)
  function ranking() {
    const saved = store.get('dfg_rank') || '';
    app().innerHTML =
      '<div class="screen t-rank">' +
      '<h2 class="hd">🏆 우리 반 명예의 전당</h2>' +
      '<div class="resgrid">' +
      '<div class="win"><div class="win-title">입력 (한 줄에 한 명: 이름, 최종자산(만원), 최대낙폭%)</div><div class="win-body">' +
      '<textarea id="rk" rows="12" placeholder="예)\n김하늘, 1850, -12\n이바다, 2310, -35\n(학생 계산기 최종 화면의 [선생님께 알려 주세요] 숫자를 옮겨 적으세요)">' + saved + '</textarea>' +
      '<div class="row"><button class="btn" id="calc">순위 계산 ▶</button></div></div></div>' +
      '<div class="win"><div class="win-title">시상</div><div class="win-body" id="awards"><p class="note">왼쪽에 입력 후 [순위 계산]을 누르세요.</p></div></div>' +
      '</div>' +
      '<div class="row center"><button class="btn" id="back">◀ 결산으로</button><button class="btn big" id="next">성찰 질문 ▶</button></div></div>';
    const calc = () => {
      const txt = $('#rk').value; store.set('dfg_rank', txt);
      const list = txt.split('\n').map((l) => l.split(/[,\t]/).map((s) => s.trim())).filter((a) => a[0] && !isNaN(parseFloat(a[1])))
        .map((a) => ({ n: a[0], v: parseFloat(a[1]), d: a[2] != null && a[2] !== '' ? -Math.abs(parseFloat(a[2])) : null }));
      if (!list.length) { $('#awards').innerHTML = '<p class="note">입력된 학생이 없습니다.</p>'; return; }
      const byV = list.slice().sort((a, b) => b.v - a.v);
      const withD = list.filter((x) => x.d != null && !isNaN(x.d)).sort((a, b) => b.d - a.d);
      let h = '<div class="award">' + img('coin', 4) + '<div><b>최고 수익상</b><br>' + byV[0].n + ' — ' + byV[0].v.toLocaleString('ko-KR') + '만원</div></div>';
      if (withD.length) h += '<div class="award">' + img('bank', 4) + '<div><b>안정 운용상</b> (최대 낙폭 최소)<br>' + withD[0].n + ' — ' + withD[0].d + '%</div></div>';
      h += '<div class="award">' + img('bond', 4) + '<div><b>근거 있는 투자상</b><br>학생 계산기 [나의 기록]의 투자 근거를 보고 교사가 선정</div></div>';
      h += '<table class="tbl"><thead><tr><th>순위</th><th>이름</th><th>최종(만원)</th><th>수익률</th></tr></thead><tbody>' +
        byV.map((x, k) => '<tr><td>' + (k + 1) + '</td><td>' + x.n + '</td><td>' + x.v.toLocaleString('ko-KR') + '</td><td class="' + cls(x.v - START / 10000) + '">' + pct((x.v / (START / 10000) - 1) * 100) + '</td></tr>').join('') +
        '</tbody></table>';
      $('#awards').innerHTML = h; sfx.up();
    };
    $('#calc').onclick = calc;
    if (saved) calc();
    $('#back').onclick = () => teacherFinal();
    $('#next').onclick = () => reflect();
  }

  function reflect() {
    playBgm('calm');
    app().innerHTML =
      '<div class="screen t-reflect">' +
      '<h2 class="hd">' + img('person', 3) + ' 성찰 질문 ' + img('person', 3) + '</h2>' +
      '<div class="qs">' + D.reflect.map((q, k) => '<div class="q"><span class="qn">Q' + (k + 1) + '</span>' + q + '</div>').join('') + '</div>' +
      '<div class="win"><div class="win-title">오늘의 핵심 정리</div><div class="win-body">' + D.summaryHTML + '</div></div>' +
      '<div class="row center"><button class="btn" id="back">◀ 결산</button><button class="btn big" id="next">금융 상식 더하기 ▶</button></div></div>';
    $('#back').onclick = () => teacherFinal();
    $('#next').onclick = () => { sfx.coin(); finance(0); };
  }

  /* ========== 금융 상식: 세금 · ETF · ISA ========== */
  function finance(k) {
    playBgm('calm');
    const F = D.finance, f = F[k];

  function calcHTML(type) {

      const dep = P.filter((p) => p.taxed);

  /* ========== 학생 계산기 ========== */

  function studentMain() {

    app().innerHTML =

      (S.i > 0 ? '<div class="note center">원금 대비 ' + '<b class="' + cls(S.cash - START) + '">' + pct((S.cash / START - 1) * 100) + '</b> · 물가 반영 실질가치 ' + won(realNow) + '</div>' : '') +

        '<span class="amoney"></span></div>').join('') +

      '<div class="pie" id="pie"></div>' +

      '<div class="row"><input id="code" maxlength="4" inputmode="numeric" placeholder="____"><button class="btn big" id="ok">확정 ▶</button></div>' +
      '<div id="msg" class="msg"></div></div></div>' +
      (S.history.length ? historyBox() : '') +
      '<div class="row center"><button class="btn small ghost" id="reset">초기화</button><button class="btn small ghost" id="home">■ 처음</button></div>' +
      '</div>';
    const rows = app().querySelectorAll('.arow');
    const get = () => { const a = {}; rows.forEach((r) => (a[r.dataset.id] = clampN($('input', r).value))); return a; };
    const upd = () => {
      const a = get(); const sum = P.reduce((t, p) => t + a[p.id], 0);
      const base = life ? S.cash - y.lifeEvent.amount : S.cash;
      rows.forEach((r) => { $('.amoney', r).textContent = won(base * a[r.dataset.id] / 100); });
      const el = $('#sum');
      el.innerHTML = '합계 <b>' + sum + '%</b> ' + (sum === 100 ? '<span class="up">OK!</span>' : '<span class="down">' + (sum > 100 ? (sum - 100) + '% 초과' : (100 - sum) + '% 남음') + '</span>');
      el.className = 'sum ' + (sum === 100 ? 'ok' : 'bad');
      $('#pie').innerHTML = P.map((p) => '<i style="flex:' + a[p.id] + ';background:' + p.color + '"></i>').join('');
      S.alloc = a; save();
      return sum;
    };
    rows.forEach((r) => {
      r.querySelectorAll('[data-d]').forEach((b) => b.onclick = () => {
        const inp = $('input', r); inp.value = clampN(+inp.value + +b.dataset.d); sfx.click(); upd();

  function clampN(v) { v = Math.round(+v || 0); return Math.max(0, Math.min(100, v)); }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

  function lifeBox(e) {

      '<div id="lifemsg" class="note">' + (S.lifePick ? '선택: ' + e.options[S.lifePick - 1].label + ' — ' + e.options[S.lifePick - 1].effect : '') + '</div>' +

  function settleYear() {
    const y = Y[S.i], i = S.i;
    let start = S.cash, lifeCost = 0, lifeNote = '';
    if (y.lifeEvent && !S.lifeDone[i]) {
      const o = y.lifeEvent.options[S.lifePick - 1];
      lifeCost = y.lifeEvent.amount * (1 + (o.extraPct || 0) / 100);
      lifeNote = y.lifeEvent.head + ' → ' + o.label + ' (' + won(lifeCost) + ' 지출)';
      start = S.cash - lifeCost;
      S.lifeDone[i] = S.lifePick; S.lifePick = null;
    }
    const end = applyYear(start, S.alloc, i);
    const rec = { year: y.year, alloc: Object.assign({}, S.alloc), start: S.cash, life: lifeCost, lifeNote, end, memo: S.memo || '' };
    S.memo = '';
    S.history.push(rec); S.cash = end; S.i++; save();
    const r = (end / (start || 1) - 1) * 100;
    (r >= 0 ? sfx.up : sfx.down)();
    app().innerHTML =
      '<div class="screen s-res">' +
      '<div class="win narrow"><div class="win-title">' + y.year + '년 결산</div><div class="win-body center">' +
      img(r >= 0 ? 'up' : 'down', 5) +

      (rec.memo ? '<p class="note">나의 투자 근거: ' + esc(rec.memo) + '</p>' : '') +

      '</div></div></div>';

  function historyBox() {
    return '<div class="win"><div class="win-title">나의 기록</div><div class="win-body"><table class="tbl small"><thead><tr><th>연도</th>' + P.map((p) => '<th>' + p.short + '</th>').join('') + '<th>연말 자산</th></tr></thead><tbody>' +

  function studentPath() { return [START].concat(S.history.map((h) => h.end)); }
  function logText() {
    const lines = ['[' + S.name + '] 투자 일지'];

      lines.push(h.year + '년: ' + P.map((p) => p.short + ' ' + h.alloc[p.id] + '%').join(', ') + ' → 연말 ' + won(h.end) + (h.lifeNote ? ' / ' + h.lifeNote : ''));

  function copyLog() {

      if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done)); }
      else fallbackCopy(t, done);
    } catch (e) { fallbackCopy(t, done); }
  }
  function fallbackCopy(t, done) {

    document.body.removeChild(ta);

  /* ---------- 투자 포트폴리오 (A4 1쪽 인쇄/PDF) ---------- */
  function printPortfolio() {
    const path = studentPath(), infl = cumInflation(Y.length);
    const end = S.cash, r = (end / START - 1) * 100, real = (end / infl / START - 1) * 100, mdd = maxDrawdown(path);
    const bm = benchmarks();
    const pick = (n) => bm.find((b) => b.name === n);
    const cmp = [pick(P.length + '종 균등분산'), pick(P[0].short + '만')].concat(P.slice(2).map((p) => pick(p.short + '만')));
    const c = document.createElement('canvas'); c.width = 1400; c.height = 560;
    const ser = [{ name: '나', color: '#e0a800', lightColor: '#d4380d', path, bold: true },
      Object.assign({}, cmp[0], { lightColor: '#333333' }), Object.assign({}, cmp[1], { lightColor: '#c2185b' })];
    drawLineChart(c, ser, ['시작'].concat(Y.map((y) => String(y.year))), { log: true, font: 26, light: true });
    const lifeNotes = S.history.filter((h) => h.lifeNote).map((h) => h.year + '년 ' + esc(h.lifeNote));
    const rows = S.history.map((h) => {
      const base = h.start - (h.life || 0), yr = (h.end / base - 1) * 100;
      return '<tr><td>' + h.year + '</td>' + P.map((p) => '<td>' + (h.alloc[p.id] || 0) + '</td>').join('') +
        '<td class="' + cls(yr) + '">' + pct(yr) + '</td><td>' + won(h.end) + '</td><td class="memo">' + esc(h.memo || '') + '</td></tr>';
    }).join('');
    const today = new Date();
    const ds = today.getFullYear() + '. ' + (today.getMonth() + 1) + '. ' + today.getDate() + '.';
    let el = document.getElementById('printArea');
    if (!el) { el = document.createElement('div'); el.id = 'printArea'; document.body.appendChild(el); }
    el.innerHTML =
      '<div class="pp">' +
      '<div class="pp-head"><div><div class="pp-sys">[System] 시뮬레이션 종료 보고서</div><h1>' + esc(D.title) + ' · 투자 포트폴리오</h1></div>' +
      '<div class="pp-who"><b>' + esc(S.name) + '</b><br>' + ds + '</div></div>' +
      '<div class="pp-kpi">' +
      '<div><span>최종 자산</span><b>' + won(end) + '</b></div>' +
      '<div><span>총 수익률</span><b class="' + cls(r) + '">' + pct(r) + '</b></div>' +
      '<div><span>실질 수익률</span><b class="' + cls(real) + '">' + pct(real) + '</b><small>8년 물가 ' + pct((infl - 1) * 100) + ' 반영</small></div>' +
      '<div><span>최대 낙폭</span><b class="down">' + mdd.toFixed(1) + '%</b></div></div>' +
      '<h2>자산 추이 (시작 ' + won(START) + ', 로그 눈금)</h2><img class="pp-chart" src="' + c.toDataURL() + '">' +
      '<h2>연도별 자산 배분(%)과 투자 근거</h2>' +
      '<table class="pp-tbl"><thead><tr><th>연도</th>' + P.map((p) => '<th>' + p.short + '</th>').join('') + '<th>그해<br>수익률</th><th>연말 자산</th><th>투자 근거</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      (lifeNotes.length ? '<p class="pp-note">생활 이벤트: ' + lifeNotes.join(' / ') + '</p>' : '') +
      '<div class="pp-two"><div><h2>비교: 한 가지 전략만 썼다면?</h2><table class="pp-tbl"><thead><tr><th>전략</th><th>최종 자산</th><th>수익률</th><th>최대 낙폭</th></tr></thead><tbody>' +
      '<tr class="me"><td>나</td><td>' + won(end) + '</td><td>' + pct(r) + '</td><td>' + mdd.toFixed(1) + '%</td></tr>' +
      cmp.map((b) => { const e = b.path[b.path.length - 1]; return '<tr><td>' + b.name + '</td><td>' + won(e) + '</td><td>' + pct((e / START - 1) * 100) + '</td><td>' + maxDrawdown(b.path).toFixed(1) + '%</td></tr>'; }).join('') +
      '</tbody></table></div>' +
      '<div><h2>나의 성찰</h2><div class="pp-q">1. 가장 잘한 판단과 아쉬운 판단은?</div><div class="pp-line"></div><div class="pp-line"></div>' +
      '<div class="pp-q">2. 다시 한다면 수익성·안전성·유동성 중 무엇을 더 고려할까?</div><div class="pp-line"></div><div class="pp-line"></div></div></div>' +
      '<p class="pp-foot">실제 한국 시장 데이터(2018~2025) 기반 모의 투자. 주식은 연말 종가 기준 가격 수익률(배당 제외), 예금·국채 일부는 추정치. 실제 투자 권유가 아닙니다. S전자=삼성전자, H반도체=SK하이닉스, C바이오=셀트리온, K항공=대한항공, N식품=농심 데이터 사용.</p>' +
      '</div>';
    const old = document.title;
    document.title = '투자포트폴리오_' + S.name.replace(/[\\/:*?"<>|\s]+/g, '_');
    setTimeout(() => { window.print(); document.title = old; }, 150);
  }

  /* ---------- 키보드 (교사 화면) ---------- */
  document.addEventListener('keydown', (e) => {
    if (/INPUT|TEXTAREA/.test((e.target || {}).tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { const b = $('#next'); if (b) b.click(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { const b = $('#prev') || $('#back'); if (b) b.click(); }
    if (e.key === 'f' || e.key === 'F') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (er) {} }
  });

  // TV 맞춤: 교사 화면은 1600×900 기준으로 설계하고 화면 크기에 맞게 확대/축소
  function fitTV() {
    const el = document.getElementById('app');
    const tv = document.body.classList.contains('tv') && !document.body.classList.contains('on-title');
    el.style.zoom = tv ? Math.max(0.55, Math.min(innerWidth / 1600, innerHeight / 900)) : '';
  }
  window.addEventListener('resize', fitTV);
  new MutationObserver(() => { if (!document.querySelector('#app .stage')) document.body.classList.remove('on-title'); fitTV(); })
    .observe(document.getElementById('app'), { childList: true });
  // 교사 화면: 내용이 화면보다 길면 한 화면에 들어오도록 자동 축소
  function fitTV() {
    const sc = document.querySelector('#app > .screen');
    if (!sc) return;
    sc.style.zoom = '';
    if (!document.body.classList.contains('tv') || sc.classList.contains('guide')) return;
    requestAnimationFrame(() => {
      const h = document.documentElement.scrollHeight, H = window.innerHeight;
      if (h > H + 2) sc.style.zoom = Math.max(0.7, (H - 8) / h).toFixed(3);
    });
  }
  window.addEventListener('resize', fitTV);
  renderAudioBar();
  window.__DFG = { applyYear, benchmarks, cumInflation, maxDrawdown, strategyPath };
  document.body.classList.add('tv');
  title();
})();

</script>
</body>
